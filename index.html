<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#20152b"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chappy Guild"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png">
<title>Chappy Guild</title>
<style>
:root{--bg:#100b18;--p:#21172e;--p2:#30213f;--ink:#fff7ea;--m:#d8c7ad;--line:#765c8d;--gold:#ffd66b;--g:#91f0b8;--r:#ff9ea9;--b:#9bd4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);min-height:100svh;padding:env(safe-area-inset-top) 13px env(safe-area-inset-bottom);background:radial-gradient(circle at 25% 0,#4d3265 0,#20152b 27%,transparent 45%),linear-gradient(180deg,#130d1b,#07050a)}
.wrap{max-width:780px;margin:0 auto;padding:16px 0 30px}header{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}h1{font-size:34px;letter-spacing:-.05em;line-height:.95;margin:0}.sub,.small{font-size:12px;color:var(--m);line-height:1.45}
button{color:var(--ink);font-weight:900;font-size:15px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#4c3663,#261932);padding:12px 13px;box-shadow:0 10px 24px #0006}button:active{transform:translateY(1px);filter:brightness(1.15)}
.pill{border-radius:999px;font-size:13px;padding:10px 12px}.tabs{position:sticky;top:0;z-index:5;background:#100b18cc;backdrop-filter:blur(10px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px 0 10px}.tabs button{font-size:12px;padding:10px 4px;border-radius:14px}.tabs button.on{background:linear-gradient(180deg,#816033,#4c2f18);border-color:#d9aa52}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stat,.card,.adv{background:linear-gradient(155deg,var(--p2),var(--p));border:1px solid #5d4770;border-radius:22px;box-shadow:inset 0 0 0 1px #fff2,0 14px 30px #0006}.stat{padding:12px}.label{font-size:12px;color:var(--m);font-weight:800}.num{font-size:25px;font-weight:1000;line-height:1;margin-top:5px}.card{padding:15px;margin:11px 0}h2{margin:0 0 12px;font-size:20px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:135px}
.adv{padding:12px;margin:10px 0;display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:start}.portrait{width:74px;height:92px;border-radius:18px;border:1px solid #8d75a8;background:linear-gradient(160deg,#745399,#23172e);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.portrait:before{content:"";position:absolute;width:54px;height:54px;border-radius:50%;background:#f4d7b0;top:12px}.portrait:after{content:"";position:absolute;width:82px;height:44px;border-radius:42px 42px 0 0;background:var(--hair,#6a3f25);bottom:0}.face{position:absolute;top:30px;color:#231313;font-size:14px;z-index:2}
.rarity{color:var(--gold);font-size:12px;letter-spacing:1px}.name{font-size:18px;font-weight:1000;margin:2px 0}.meta{font-size:12px;color:var(--m);line-height:1.45}.bars{grid-column:1/3;display:grid;gap:5px;margin-top:4px}.barline{display:grid;grid-template-columns:44px 1fr 30px;gap:7px;align-items:center;font-size:12px;color:var(--m)}.bar{height:8px;background:#0b0710;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a775ff,#ffd66b);border-radius:99px}
.quest{background:#130d1c;border:1px solid #48365b;border-radius:18px;padding:12px;margin:9px 0}.quest b{font-size:16px}.select{width:100%;margin:7px 0;background:#181020;text-align:left}.good{color:var(--g)}.bad{color:var(--r)}.gold{color:var(--gold)}.blue{color:var(--b)}#log{height:230px;overflow:auto;background:#07050a;border:1px solid #4a375c;border-radius:18px;padding:11px;font-size:13px;line-height:1.55}.hidden{display:none}.footer{font-size:12px;text-align:center;color:var(--m);margin-top:14px}@media(max-width:430px){h1{font-size:31px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<header><div><h1>Chappy Guild</h1><div class="sub">冒険者ギルド経営シミュレーター v0.1</div></div><button class="pill" id="newBtn">新規</button></header>
<div class="grid"><div class="stat"><div class="label">資金</div><div class="num" id="gold">120</div><div class="small">G</div></div><div class="stat"><div class="label">月</div><div class="num" id="month">1</div><div class="small">Month</div></div><div class="stat"><div class="label">名声</div><div class="num" id="fame">0</div><div class="small">Fame</div></div><div class="stat"><div class="label">ランク</div><div class="num" id="rank">F</div><div class="small">Guild</div></div></div>
<nav class="tabs"><button id="tabHome">酒場</button><button id="tabGuild">冒険者</button><button id="tabQuest">依頼</button><button id="tabLog">ログ</button></nav>
<section id="home" class="page"><div class="card"><h2>酒場</h2><div class="small">冒険者を募集して、育てて、依頼に派遣しよう。疲労が溜まると失敗や離脱の原因になるよ。</div><div class="row" style="margin-top:12px"><button id="scoutBtn">冒険者募集 30G</button><button id="restBtn">全員休養 20G</button></div></div><div class="card"><h2>今回の募集結果</h2><div id="recruit"></div></div></section>
<section id="guild" class="page hidden"><div class="card"><h2>冒険者</h2><div class="row"><button id="trainCombat">戦闘訓練 18G</button><button id="trainExplore">探索訓練 18G</button><button id="equipBtn">装備更新 25G</button></div><div id="adventurers"></div></div></section>
<section id="quest" class="page hidden"><div class="card"><h2>依頼掲示板</h2><div id="quests"></div></div></section>
<section id="logPage" class="page hidden"><div class="card"><h2>ギルド日誌</h2><div id="log"></div></div></section>
<div class="footer">GitHub Pagesに置くと、iPhoneのホーム画面に追加できます。</div></div>
<script>
(function(){"use strict";
var KEY="chappy_guild_v01",state;
var first=["リリィ","ミナ","セレナ","ノア","アイリ","ルカ","フィオ","メイ","カナン","エル"];
var jobs=[["剣士",18,6,4,"戦闘"],["弓使い",12,14,5,"森"],["魔法使い",16,9,7,"魔法"],["盗賊",7,19,8,"探索"],["僧侶",8,10,18,"癒し"],["吟遊詩人",5,8,22,"交渉"]];
var traits=[["負けず嫌い","成功時報酬+10%、疲労+5"],["慎重派","失敗率-8%、報酬-5%"],["天然","疲労増加-20%"],["元貴族","交渉依頼に強い"],["野生児","探索依頼に強い"],["おしゃべり","交渉依頼に強い"],["方向音痴","探索が少し不安"],["昼寝好き","休養回復+10"]];
var qpool=[["森のスライム討伐","combat",38,38,"戦闘"],["古い遺跡の調査","explore",42,45,"探索"],["商隊の護衛","combat",50,58,"護衛"],["迷子の猫探し","charm",28,25,"街"],["薬草採集","explore",34,32,"採集"],["貴族の晩餐警備","charm",46,54,"交渉"],["ゴブリンの巣穴掃討","combat",60,76,"戦闘"],["幽霊屋敷の確認","explore",58,72,"探索"]];
function rnd(n){return Math.floor(Math.random()*n)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function stars(r){return"★★★★★".slice(0,r)+"☆☆☆☆☆".slice(0,5-r)}function rank(){var f=state.fame;return f>160?"S":f>110?"A":f>72?"B":f>42?"C":f>18?"D":"F"}
function makeAdv(fr){var rarity=fr||pickRarity(),j=jobs[rnd(jobs.length)],t=traits[rnd(traits.length)],base=20+rarity*8+rnd(14),hair=["#49301e","#2c203d","#7d5333","#bfa36a","#26384f","#60344b"][rnd(6)];return{id:Date.now()+""+rnd(999999),name:first[rnd(first.length)]+"・"+String.fromCharCode(65+rnd(26)),rarity:rarity,job:j[0],trait:t[0],note:t[1],attr:j[4],hair:hair,combat:clamp(base+j[1]+rnd(18),1,99),explore:clamp(base+j[2]+rnd(18),1,99),charm:clamp(base+j[3]+rnd(18),1,99),fatigue:rnd(18),lv:1,equip:0}}
function pickRarity(){var r=rnd(100);if(r<4)return 5;if(r<14)return 4;if(r<36)return 3;if(r<70)return 2;return 1}
function rollQuests(){var a=[];for(var i=0;i<4;i++){var q=qpool[rnd(qpool.length)];a.push({name:q[0],need:q[1],diff:q[2],pay:q[3],type:q[4]})}return a}
function fresh(){return{gold:120,month:1,fame:0,log:["<span class='gold'>Chappy Guild 開業！</span> 酒場に小さな看板を出した。"],advs:[makeAdv(2),makeAdv(2)],recruit:null,quests:rollQuests()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state.advs)state=fresh()}catch(e){state=fresh()}}
function log(t){state.log.unshift("M"+state.month+"： "+t);state.log=state.log.slice(0,80)}
function show(id){["home","guild","quest","logPage"].forEach(function(x){document.getElementById(x).classList.add("hidden")});document.getElementById(id).classList.remove("hidden");[["tabHome","home"],["tabGuild","guild"],["tabQuest","quest"],["tabLog","logPage"]].forEach(function(x){document.getElementById(x[0]).classList.toggle("on",x[1]===id)});render()}
function render(){document.getElementById("gold").textContent=state.gold;document.getElementById("month").textContent=state.month;document.getElementById("fame").textContent=state.fame;document.getElementById("rank").textContent=rank();document.getElementById("recruit").innerHTML=state.recruit?advCard(state.recruit,true):"<div class='small'>まだ募集していない。30Gで1人募集できる。</div>";document.getElementById("adventurers").innerHTML=state.advs.map(function(a){return advCard(a,false)}).join("");document.getElementById("quests").innerHTML=state.quests.map(qcard).join("");document.getElementById("log").innerHTML=state.log.join("<br>");bind();save()}
function advCard(a,rec){var face=a.rarity>=4?"✦ᴗ✦":"•ᴗ•";return"<div class='adv'><div class='portrait' style='--hair:"+a.hair+"'><div class='face'>"+face+"</div></div><div><div class='rarity'>"+stars(a.rarity)+"</div><div class='name'>"+a.name+"</div><div class='meta'>"+a.job+" / 特性: "+a.trait+"<br>"+a.note+"<br>Lv."+a.lv+" 装備+"+a.equip+" 疲労 "+a.fatigue+"</div></div><div class='bars'>"+bar("戦闘",a.combat)+bar("探索",a.explore)+bar("交渉",a.charm)+bar("疲労",a.fatigue,true)+"</div>"+(rec?"<button class='select keep' data-id='"+a.id+"'>採用する</button>":"")+"</div>"}
function bar(l,v,b){return"<div class='barline'><span>"+l+"</span><div class='bar'><i style='width:"+clamp(v,0,100)+"%;"+(b?"background:linear-gradient(90deg,#ff9ea9,#ffd66b)":"")+"'></i></div><span>"+v+"</span></div>"}
function qcard(q,i){var need=q.need==="combat"?"戦闘":q.need==="explore"?"探索":"交渉",opts=state.advs.map(function(a){return"<button class='select dispatch' data-q='"+i+"' data-a='"+a.id+"'>"+a.name+" を派遣 / "+need+" "+power(a,q.need)+" / 疲労 "+a.fatigue+"</button>"}).join("");return"<div class='quest'><b>"+q.name+"</b><div class='small'>種別 "+q.type+" / 必要 "+need+" / 難度 "+q.diff+" / 報酬 "+q.pay+"G</div>"+opts+"</div>"}
function power(a,n){return clamp(a[n]+a.equip*7-Math.round(a.fatigue*.55),1,140)}
function scout(){if(state.gold<30){log("<span class='bad'>募集資金が足りない。</span>");render();return}state.gold-=30;state.recruit=makeAdv();log("酒場で新しい冒険者候補を見つけた。<span class='gold'>"+state.recruit.name+"</span> がこちらを見ている。");render()}
function keep(id){if(!state.recruit||state.recruit.id!==id)return;state.advs.push(state.recruit);log("<span class='good'>"+state.recruit.name+" を採用！</span>");state.recruit=null;render()}
function train(k){if(state.gold<18){log("<span class='bad'>訓練費が足りない。</span>");render();return}state.gold-=18;state.advs.forEach(function(a){if(k==="combat")a.combat=clamp(a.combat+4+rnd(8),1,99);else a.explore=clamp(a.explore+4+rnd(8),1,99);a.fatigue=clamp(a.fatigue+5+rnd(8),0,100)});log(k==="combat"?"戦闘訓練を実施。":"探索訓練を実施。");passMonth()}
function equip(){if(state.gold<25){log("<span class='bad'>装備費が足りない。</span>");render();return}state.gold-=25;var a=state.advs[rnd(state.advs.length)];a.equip++;a.fatigue=clamp(a.fatigue+3,0,100);log("<span class='blue'>"+a.name+" の装備を更新。</span> 装備+"+a.equip);passMonth()}
function rest(){if(state.gold<20){log("<span class='bad'>休養費が足りない。</span>");render();return}state.gold-=20;state.advs.forEach(function(a){a.fatigue=clamp(a.fatigue-28-(a.trait==="昼寝好き"?10:0)-rnd(12),0,100)});log("全員で休養。ギルドの空気が少しやわらかくなった。");passMonth()}
function dispatch(qi,aid){var q=state.quests[qi],a=state.advs.find(function(x){return x.id===aid});if(!q||!a)return;var p=power(a,q.need),chance=clamp(50+(p-q.diff)*1.4,8,96);if(a.trait==="慎重派")chance+=8;if((a.trait==="野生児"&&q.need==="explore")||(a.trait==="元貴族"&&q.need==="charm")||(a.trait==="おしゃべり"&&q.need==="charm"))chance+=12;var ok=rnd(100)<chance,fg=12+rnd(16);if(a.trait==="天然")fg=Math.round(fg*.8);a.fatigue=clamp(a.fatigue+fg+(a.trait==="負けず嫌い"?5:0),0,100);if(ok){var pay=q.pay;if(a.trait==="負けず嫌い")pay=Math.round(pay*1.1);if(a.trait==="慎重派")pay=Math.round(pay*.95);state.gold+=pay;var fame=3+Math.floor(q.diff/18);state.fame+=fame;a.lv++;a[q.need]=clamp(a[q.need]+2+rnd(5),1,99);log("<span class='good'>依頼成功！</span> "+a.name+" が「"+q.name+"」を達成。+"+pay+"G / 名声+"+fame)}else{state.fame=Math.max(0,state.fame-1);log("<span class='bad'>依頼失敗……</span> "+a.name+" は「"+q.name+"」から撤退。")}state.quests.splice(qi,1);if(state.quests.length===0){state.quests=rollQuests();log("新しい依頼が掲示板に貼られた。");passMonth()}render()}
function passMonth(){state.month++;state.gold-=state.advs.length*3;if(rnd(100)<38)event();state.advs=state.advs.filter(function(a){if(a.fatigue>94&&rnd(100)<22){log("<span class='bad'>"+a.name+" が療養のため長期離脱した……。</span>");return false}return true});if(state.advs.length===0){state.advs.push(makeAdv(1));log("見習い冒険者が一人、ギルドを助けに来てくれた。")}if(state.gold<0){log("<span class='bad'>資金が底をついた。酒場のマスターに借金した……。</span>");state.gold=20;state.fame=Math.max(0,state.fame-8)}render()}
function event(){var r=rnd(4);if(r===0){state.gold+=18;log("<span class='good'>常連客が差し入れをくれた。</span> +18G")}if(r===1){state.fame+=4;log("<span class='gold'>吟遊詩人がギルドの噂を広めた。</span> 名声+4")}if(r===2){state.gold-=10;log("<span class='bad'>酒場の椅子を壊された。</span> 修理費-10G")}if(r===3){var a=state.advs[rnd(state.advs.length)];a.charm=clamp(a.charm+6,1,99);log(a.name+" が街の子どもに懐かれた。交渉+6")}}
function bind(){document.querySelectorAll(".dispatch").forEach(function(b){b.onclick=function(){dispatch(Number(this.dataset.q),this.dataset.a)}});document.querySelectorAll(".keep").forEach(function(b){b.onclick=function(){keep(this.dataset.id)}})}
document.getElementById("tabHome").onclick=function(){show("home")};document.getElementById("tabGuild").onclick=function(){show("guild")};document.getElementById("tabQuest").onclick=function(){show("quest")};document.getElementById("tabLog").onclick=function(){show("logPage")};document.getElementById("scoutBtn").onclick=scout;document.getElementById("restBtn").onclick=rest;document.getElementById("trainCombat").onclick=function(){train("combat")};document.getElementById("trainExplore").onclick=function(){train("explore")};document.getElementById("equipBtn").onclick=equip;document.getElementById("newBtn").onclick=function(){if(confirm("最初から始める？")){state=fresh();save();show("home")}};
window.addEventListener("error",function(e){var l=document.getElementById("log");if(l)l.innerHTML="<span class='bad'>エラー: "+e.message+"</span><br>"+l.innerHTML});
load();show("home");if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js").catch(function(){})}
})();
</script></body></html>
